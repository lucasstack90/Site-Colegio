<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Minha Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

   

    <div class="container">
        <div class="row">

            <div class="col-lg-6 mb-4">
                <h2 class="mb-4 text-primary">Envie sua Mensagem</h2>
                <form>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="assunto" class="form-label">Assunto</label>
                        <select class="form-select" id="assunto">
                            <option selected>Selecione um Assunto</option>
                            <option value="duvidas">Dúvidas Gerais</option>
                            <option value="suporte">Suporte Técnico</option>
                            <option value="comercial">Comercial</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="mensagem" class="form-label">Mensagem</label>
                        <textarea class="form-control" id="mensagem" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-send-fill me-2"></i> Enviar
                    </button>
                </form>
            </div>

            <div class="col-lg-6">
                <h2 class="mb-4 text-primary">Nossos Dados</h2>

                <div class="card p-3 mb-4 shadow-sm">
                    <ul class="list-unstyled">
                        <li class="mb-2">
                            <i class="bi bi-geo-alt-fill text-primary me-2"></i> 
                            <strong>Endereço:</strong> Rua da Programação, 123 - Centro - Cidade Digital, CD
                        </li>
                        <li class="mb-2">
                            <i class="bi bi-telephone-fill text-primary me-2"></i> 
                            <strong>Telefone:</strong> (11) 98765-4321
                        </li>
                        <li class="mb-2">
                            <i class="bi bi-envelope-fill text-primary me-2"></i> 
                            <strong>Email:</strong> contato@minhaempresa.com.br
                        </li>
                        <li class="mb-2">
                            <i class="bi bi-clock-fill text-primary me-2"></i> 
                            <strong>Horário:</strong> Seg. a Sex. das 9h às 18h
                        </li>
                    </ul>
                </div>

                <h3 class="mb-3 text-primary">Onde Estamos</h3>
                <div class="map-responsive">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.4851212874136!2d-46.63935218449641!3d-23.550519967119793!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59a3564e9a3b%3A0x8d51e7371900c415!2sPra%C3%A7a%20da%20S%C3%A9!5e0!3m2!1spt-BR!2sbr!4v1621300000000!5m2!1spt-BR!2sbr" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

        </div>
    </div>

    <footer class="bg-light text-center py-3 mt-5 border-top">
        <p>&copy; 2024 Minha Empresa. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
